<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNX Struktur — Wohnobjekt-Editor</title>
<script>
/* Muss vor dem Stylesheet laufen, sonst blitzt die Seite erst hell auf.
   Die Systemvorgabe wird hier zu "light" oder "dark" aufgeloest - das
   Stylesheet kennt nur diese zwei Werte und braucht deshalb keine zweite,
   doppelt gepflegte Palette fuer prefers-color-scheme. */
(() => {
  const KEY = 'knx-theme-v1', MODES = ['system', 'light', 'dark'];
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  let pref = 'system';
  try { pref = localStorage.getItem(KEY) || 'system'; } catch (e) { /* nur Komfort */ }
  if (!MODES.includes(pref)) pref = 'system';

  const apply = () => {
    document.documentElement.dataset.theme =
      pref === 'system' ? (media.matches ? 'dark' : 'light') : pref;
  };
  apply();
  media.addEventListener('change', () => { if (pref === 'system') apply(); });

  window.KNXTheme = {
    MODES,
    mode: () => pref,
    resolved: () => document.documentElement.dataset.theme,
    set(next) {
      pref = MODES.includes(next) ? next : 'system';
      try { localStorage.setItem(KEY, pref); } catch (e) { /* nur Komfort */ }
      apply();
      return pref;
    },
    next: () => ({ system: 'light', light: 'dark', dark: 'system' })[pref]
  };
})();
</script>
<link rel="stylesheet" href="styles.css">
<!-- Sprache vor dem Aufbau: der feste Text wird sonst erst deutsch gezeigt. -->
<script src="knx-i18n.js"></script>
<script src="knx-lang-en.js"></script>
</head>
<body>
<div id="app" data-pt-id="app-shell">

  <!-- ================= Topbar ================= -->
  <header id="topbar" data-pt-id="topbar">
    <div class="brand" data-pt-id="brand">
      <img class="logo" src="selfbus-logo.png" alt="Selfbus" width="76" height="32">
      <div class="brand-text">
        <b data-i18n>KNX Struktur</b>
        <span data-i18n>Wohnobjekt- &amp; Gruppenadress-Editor</span>
      </div>
    </div>

    <input id="project-name" data-pt-id="project-name" aria-label="Projektname" data-i18n-aria-label spellcheck="false">
    <span id="project-kind" class="dpt-tag" aria-hidden="true" title="Typ des geladenen Projekts" data-i18n-title data-i18n>Musterprojekt</span>

    <div class="histbar" role="group" aria-label="Verlauf" data-i18n-aria-label>
      <button id="btn-back" class="hist-btn" data-pt-id="btn-back" aria-label="Zurück" data-i18n-aria-label disabled>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button id="btn-fwd" class="hist-btn" data-pt-id="btn-fwd" aria-label="Vor" data-i18n-aria-label disabled>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg>
      </button>
      <span class="hist-sep" aria-hidden="true"></span>
      <button id="btn-undo" class="hist-btn" data-pt-id="btn-undo" aria-label="Rückgängig" data-i18n-aria-label disabled>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7h7a3.5 3.5 0 0 1 0 7H7"/><path d="M6 4 3 7l3 3"/></svg>
      </button>
      <button id="btn-redo" class="hist-btn" data-pt-id="btn-redo" aria-label="Wiederholen" data-i18n-aria-label disabled>
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 7H6a3.5 3.5 0 0 0 0 7h3"/><path d="M10 4l3 3-3 3"/></svg>
      </button>
    </div>

    <div class="spacer"></div>

    <label class="topbar-field" title="Darstellung der Gruppenadressen (projektweit)" data-i18n-title>
      <span data-i18n>Adressen</span>
      <select id="ga-style" data-pt-id="ga-style" aria-label="Adressstil" data-i18n-aria-label>
        <option value="three" data-i18n>3-stufig</option>
        <option value="two" data-i18n>2-stufig</option>
        <option value="free" data-i18n>frei</option>
      </select>
    </label>

    <label class="topbar-field" title="Sprache der Oberfläche" data-i18n-title>
      <span data-i18n>Sprache</span>
      <select id="ui-lang" data-pt-id="ui-lang" aria-label="Sprache" data-i18n-aria-label></select>
    </label>
    <button id="btn-theme" class="btn btn-icon" data-pt-id="btn-theme" aria-label="Darstellung"></button>
    <button id="btn-export" class="btn" data-pt-id="btn-export" title="Projekt als JSON-Datei speichern" data-i18n-title data-i18n>Export</button>
    <button id="btn-import" class="btn" data-pt-id="btn-import" title="Projekt aus JSON-Datei oder ETS-Projekt (.knxproj) laden" data-i18n-title data-i18n>Import</button>
    <input type="file" id="import-file" accept=".json,application/json,.knxproj" hidden>
    <input type="file" id="prod-file" accept=".knxprod" hidden>
    <button id="btn-projects" class="btn" data-pt-id="btn-projects" hidden
            title="Projekte auf diesem Rechner verwalten" data-i18n-title data-i18n>Projekte</button>
    <button id="btn-prog" class="btn" data-pt-id="btn-prog" hidden
            title="Geräte programmieren: Adresse, Applikation, Parameter und Gruppenadressen"><span data-i18n>Programmieren</span><span class="btn-badge" hidden></span></button>
    <!-- Nur mit --debug: das Werkzeug zum Testen und zur Fehlersuche -->
    <button id="btn-bus" class="btn btn-icon" data-pt-id="btn-bus" hidden
            title="Geräte am Bus suchen, auslesen und adressieren" data-i18n-title
            aria-label="Inbetriebnahme" data-i18n-aria-label>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </button>
    <button id="btn-new" class="btn btn-primary" data-pt-id="btn-new" title="Leeres Projekt starten" data-i18n-title data-i18n>Neues Projekt</button>
  </header>

  <!-- ================= Hauptbereich ================= -->
  <main id="main">

    <!-- Strukturbaum: Gebäude / Topologie / Gruppenadressen -->
    <section class="pane" data-pt-id="tree-pane" aria-label="Projektstruktur" data-i18n-aria-label>
      <div class="pane-head">
        <div class="tabs" role="tablist" aria-label="Ansicht" data-i18n-aria-label>
          <button class="tab" data-view="building" role="tab" data-pt-id="tab-building"
                  title="Wo ist etwas verbaut" data-i18n-title data-i18n>Gebäude</button>
          <button class="tab" data-view="topology" role="tab" data-pt-id="tab-topology"
                  title="Bereiche, Linien und Teilnehmer" data-i18n-title data-i18n>Topologie</button>
          <button class="tab" data-view="ga" role="tab" data-pt-id="tab-ga"
                  title="Haupt- und Mittelgruppen" data-i18n-title data-i18n>Gruppen</button>
        </div>
        <div class="pane-tools">
          <button id="btn-tree-add" class="btn btn-sm" data-pt-id="btn-tree-add">+</button>
        </div>
      </div>
      <div class="tree-tools" data-pt-id="tree-tools">
        <input id="tree-search" class="input search" data-pt-id="tree-search" type="search"
               placeholder="Baum filtern …" aria-label="Baum filtern" data-i18n-placeholder data-i18n-aria-label spellcheck="false">
        <button id="btn-tree-props" class="icon-btn tool-btn" data-pt-id="btn-tree-props" aria-haspopup="dialog" aria-expanded="false"
                title="Nach Eigenschaften filtern" aria-label="Nach Eigenschaften filtern" data-i18n-title data-i18n-aria-label>
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2.5 3.5h11L9.3 8.5v4l-2.6 1.2V8.5z"/></svg>
          <span class="tool-badge" hidden></span>
        </button>
        <span class="hist-sep" aria-hidden="true"></span>
        <button id="btn-tree-expand" class="icon-btn tool-btn" data-pt-id="btn-tree-expand"
                title="Alle aufklappen" aria-label="Alle aufklappen" data-i18n-title data-i18n-aria-label>
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5.5 2.5h8v8"/><rect x="2.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M6.5 7.5v4M4.5 9.5h4"/></svg>
        </button>
        <button id="btn-tree-collapse" class="icon-btn tool-btn" data-pt-id="btn-tree-collapse"
                title="Alle zuklappen" aria-label="Alle zuklappen" data-i18n-title data-i18n-aria-label>
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5.5 2.5h8v8"/><rect x="2.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M4.5 9.5h4"/></svg>
        </button>
      </div>
      <nav id="tree" data-pt-id="tree" role="tree" aria-label="Projektstruktur">
        <div id="tree-inner"></div>
      </nav>
      <div id="tree-count" class="pane-foot"></div>
    </section>

    <div class="resizer" id="resize-1" data-edge="left" role="separator"
         aria-orientation="vertical" aria-label="Breite der Strukturspalte" data-i18n-aria-label tabindex="0"></div>

    <!-- Gruppenadressen / Geräte -->
    <section class="pane" data-pt-id="ga-pane" aria-label="Adressen und Geräte" data-i18n-aria-label>
      <div class="pane-head">
        <div class="tabs" role="tablist" aria-label="Tabelle" data-i18n-aria-label>
          <button class="tab" data-mid="ga" role="tab" data-pt-id="tab-mid-ga" data-i18n>Gruppenadressen</button>
          <button class="tab" data-mid="dev" role="tab" data-pt-id="tab-mid-dev" data-i18n>Geräte</button>
        </div>
        <input id="search" class="input search" data-pt-id="search" type="search"
               placeholder="Suchen …" aria-label="Suchen" data-i18n-placeholder data-i18n-aria-label spellcheck="false">
        <div class="pane-tools">
          <span id="ga-count" class="pane-meta"></span>
          <button id="btn-del-sel" class="btn btn-sm btn-danger" data-pt-id="btn-del-sel" hidden
                  title="Markierte Adressen löschen" data-i18n-title data-i18n>Löschen</button>
          <button id="btn-move-sel" class="btn btn-sm" data-pt-id="btn-move-sel" hidden
                  title="Markierte Adressen in eine andere Gruppe verschieben — oder auf eine Gruppe im Baum ziehen" data-i18n-title data-i18n>Verschieben</button>
          <button id="btn-add-row" class="btn btn-sm btn-primary" data-pt-id="btn-add-row" data-i18n>+ Adresse</button>
        </div>
      </div>
      <div id="filter-bar" hidden>
        <span id="ga-filter-info" class="dpt-tag"></span>
        <button id="btn-clear-filter" class="btn btn-sm" data-pt-id="btn-clear-filter"
                title="Filter entfernen" data-i18n-title data-i18n>✕ Filter</button>
      </div>
      <div id="ga-scroll">
        <table class="ga" id="tbl-ga" data-pt-id="ga-table">
          <thead>
            <tr>
              <th class="col-chk"><input type="checkbox" id="chk-all" aria-label="Alle Adressen markieren" data-i18n-aria-label></th>
              <th class="sortable col-addr" data-key="addr" title="Nach Adresse sortieren" data-i18n-title><span data-i18n>Adresse</span> <span class="arrow"></span></th>
              <th class="sortable" data-key="name" title="Nach Name sortieren" data-i18n-title><span data-i18n>Name</span> <span class="arrow"></span></th>
              <th class="sortable col-dpt" data-key="func" title="Nach Datenpunkttyp sortieren" data-i18n-title><span data-i18n>DPT</span> <span class="arrow"></span></th>
              <th class="col-objs" data-i18n>Objekte</th>
              <th class="col-rooms" data-i18n>Räume</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="ga-tbody"></tbody>
        </table>
        <table class="ga" id="tbl-dev" data-pt-id="dev-table" hidden>
          <thead>
            <tr>
              <th class="sortable col-addr" data-key="addr" title="Nach Adresse sortieren" data-i18n-title><span data-i18n>Adresse</span> <span class="arrow"></span></th>
              <th class="sortable" data-key="name" title="Nach Name sortieren" data-i18n-title><span data-i18n>Gerät</span> <span class="arrow"></span></th>
              <th class="col-line" data-i18n>Linie</th>
              <th class="col-rooms" data-i18n>Verbaut in</th>
              <th class="col-kos" data-i18n>Objekte</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="dev-tbody"></tbody>
        </table>
      </div>
    </section>

    <div class="resizer" id="resize-2" data-edge="right" role="separator"
         aria-orientation="vertical" aria-label="Breite der Detailspalte" data-i18n-aria-label tabindex="0"></div>

    <!-- Detail -->
    <section class="pane" data-pt-id="detail-pane" aria-label="Details" data-i18n-aria-label>
      <div class="pane-head"><h2 data-i18n>Details</h2></div>
      <div id="detail" data-pt-id="detail"></div>
    </section>
  </main>

  <!-- ================= Statusleiste ================= -->
  <footer id="statusbar" data-pt-id="statusbar">
    <span class="stat"><span data-i18n>Räume:</span> <b id="stat-rooms">0</b></span>
    <span class="stat"><span data-i18n>Geräte:</span> <b id="stat-devs">0</b></span>
    <span class="stat"><span data-i18n>Adressen:</span> <b id="stat-ga">0</b></span>
    <span class="stat"><span data-i18n>Zuordnungen:</span> <b id="stat-links">0</b></span>
    <div id="stat-bar" data-pt-id="stat-bar"></div>
    <span id="stat-bar-info" class="bar-info"></span>
    <span id="drag-hint" role="status" aria-live="polite"></span>
    <div class="spacer"></div>
    <button id="btn-issues" class="issues" data-pt-id="btn-issues" hidden></button>
    <span id="status-msg" role="status"></span>
  </footer>
</div>


<!-- ================= Modal ================= -->
<div id="modal-backdrop">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header id="modal-title"></header>
    <div class="mbody" id="modal-body"></div>
    <footer>
      <button id="modal-cancel" class="btn" data-pt-id="modal-cancel" data-i18n>Abbrechen</button>
      <button id="modal-ok" class="btn btn-primary" data-pt-id="modal-ok" data-i18n>OK</button>
    </footer>
  </div>
</div>

<div id="toast" role="status"></div>

<!-- Laedt zuerst die Anbindung an den lokalen Dienst; sie zieht die uebrigen
     Skripte in fester Reihenfolge nach, sobald das Projekt bereitsteht. -->
<script src="knx-backend.js"></script>
</body>
</html>
